{{- if .Values.clickhouse.deploy -}}
{{- $defaultPodSecurityContext := dict "fsGroup" 1001 "fsGroupChangePolicy" "OnRootMismatch" "runAsUser" 1001 "runAsGroup" 1001 "runAsNonRoot" true "supplementalGroups" (list 1001) -}}
{{- $podSecurityContextValues := .Values.clickhouse.podSecurityContext | default dict -}}
{{- $podSecurityContextEnabled := true -}}
{{- if hasKey $podSecurityContextValues "enabled" -}}
{{- $podSecurityContextEnabled = $podSecurityContextValues.enabled -}}
{{- end -}}
{{- $podSecurityContext := mergeOverwrite (deepCopy $defaultPodSecurityContext) (omit $podSecurityContextValues "enabled") -}}
{{- $defaultContainerSecurityContext := dict "runAsNonRoot" true "runAsUser" 1001 "runAsGroup" 1001 "privileged" false "readOnlyRootFilesystem" true "allowPrivilegeEscalation" false "capabilities" (dict "drop" (list "ALL")) "seccompProfile" (dict "type" "RuntimeDefault") -}}
{{- $containerSecurityContextValues := coalesce .Values.clickhouse.containerSecurityContext .Values.clickhouse.securityContext (dict) -}}
{{- $containerSecurityContextEnabled := true -}}
{{- if hasKey $containerSecurityContextValues "enabled" -}}
{{- $containerSecurityContextEnabled = $containerSecurityContextValues.enabled -}}
{{- end -}}
{{- $containerSecurityContext := mergeOverwrite (deepCopy $defaultContainerSecurityContext) (omit $containerSecurityContextValues "enabled") -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "langfuse.fullname" . }}-clickhouse-shard0
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "langfuse.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  replicas: {{ .Values.clickhouse.replicaCount | default 1 }}
  serviceName: {{ include "langfuse.fullname" . }}-clickhouse-headless
  podManagementPolicy: {{ .Values.clickhouse.podManagementPolicy | default "OrderedReady" }}
  selector:
    matchLabels:
      {{- include "langfuse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: clickhouse
      shard: "0"
  template:
    metadata:
      labels:
        {{- include "langfuse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: clickhouse
        shard: "0"
    spec:
      terminationGracePeriodSeconds: {{ .Values.clickhouse.terminationGracePeriodSeconds | default 30 }}
      {{- if .Values.clickhouse.affinity }}
      affinity:
        {{- toYaml .Values.clickhouse.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if $podSecurityContextEnabled }}
      securityContext:
        {{- toYaml $podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
      - name: clickhouse
        image: "{{ if .Values.clickhouse.image.registry }}{{ .Values.clickhouse.image.registry }}/{{ end }}{{ .Values.clickhouse.image.repository }}:{{ .Values.clickhouse.image.tag }}"
        imagePullPolicy: IfNotPresent
        {{- if $containerSecurityContextEnabled }}
        securityContext:
          {{- toYaml $containerSecurityContext | nindent 10 }}
        {{- end }}
        ports:
        - name: http
          containerPort: 8123
          protocol: TCP
        - name: tcp
          containerPort: 9000
          protocol: TCP
        - name: interserver
          containerPort: 9009
          protocol: TCP
        env:
        - name: REPLICA_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: CLICKHOUSE_USER
          # value: {{ .Values.clickhouse.auth.username | quote }}
          value: "default"
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              # name: {{ include "langfuse.fullname" . }}-clickhouse
              # key: admin-password
              name: langfuse-secrets
              key: clickhouse_password
        - name: CLICKHOUSE_ADMIN_USER
          # value: {{ .Values.clickhouse.auth.username | quote }}
          value: "default"
        - name: CLICKHOUSE_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              # name: {{ include "langfuse.fullname" . }}-clickhouse
              # key: admin-password
              name: langfuse-secrets
              key: clickhouse_password
        {{- if .Values.clickhouse.gcsStorage.enabled }}
        - name: CLICKHOUSE_GCS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.clickhouse.gcsStorage.accessKeyId.secretKeyRef.name }}
              key: {{ .Values.clickhouse.gcsStorage.accessKeyId.secretKeyRef.key }}
        - name: CLICKHOUSE_GCS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.clickhouse.gcsStorage.secretAccessKey.secretKeyRef.name }}
              key: {{ .Values.clickhouse.gcsStorage.secretAccessKey.secretKeyRef.key }}
        {{- end }}
        {{- if .Values.clickhouse.resources }}
        resources:
          {{- toYaml .Values.clickhouse.resources | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: data
          mountPath: /var/lib/clickhouse
          subPath: data
        {{- if .Values.clickhouse.gcsStorage.enabled }}
        - name: gcs-cache
          mountPath: /var/lib/clickhouse/gcs_cache
        {{- end }}
        - name: config
          mountPath: /etc/clickhouse-server/config.d/
        - name: usersd
          mountPath: /etc/clickhouse-server/users.d/
        - name: logs
          mountPath: /var/log/clickhouse-server
        - name: tmp
          mountPath: /tmp
        - name: run
          mountPath: /run
        livenessProbe:
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: config
        configMap:
          name: {{ include "langfuse.fullname" . }}-clickhouse-config
      - name: usersd
        emptyDir: {}
      - name: logs
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      - name: run
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if .Values.clickhouse.persistence.storageClass }}
      storageClassName: {{ .Values.clickhouse.persistence.storageClass | quote }}
      {{- end }}
      resources:
        requests:
          {{- if and .Values.clickhouse.gcsStorage.enabled (eq .Values.clickhouse.gcsStorage.policy "gcs_only") }}
          storage: {{ .Values.clickhouse.gcsStorage.metadataSize | default "10Gi" }}
          {{- else if and .Values.clickhouse.gcsStorage.enabled (eq .Values.clickhouse.gcsStorage.policy "hot_local_cold_gcs") }}
          storage: {{ .Values.clickhouse.persistence.size | default "100Gi" }}
          {{- else }}
          storage: {{ .Values.clickhouse.persistence.size | default "100Gi" }}
          {{- end }}
  {{- if .Values.clickhouse.gcsStorage.enabled }}
  - metadata:
      name: gcs-cache
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if .Values.clickhouse.gcsStorage.cache.storageClass }}
      storageClassName: {{ .Values.clickhouse.gcsStorage.cache.storageClass | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.clickhouse.gcsStorage.cache.size | default "30Gi" }}
  {{- end }}
{{- end }}
