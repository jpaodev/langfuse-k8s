{{- if .Values.clickhouse.deploy -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "langfuse.fullname" . }}-clickhouse
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "langfuse.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  type: ClusterIP
  ports:
  - name: http
    port: {{ .Values.clickhouse.httpPort | default 8123 }}
    targetPort: 8123
    protocol: TCP
  - name: tcp
    port: {{ .Values.clickhouse.nativePort | default 9000 }}
    targetPort: 9000
    protocol: TCP
  selector:
    {{- include "langfuse.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "langfuse.fullname" . }}-clickhouse-headless
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "langfuse.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8123
    targetPort: 8123
    protocol: TCP
  - name: tcp
    port: 9000
    targetPort: 9000
    protocol: TCP
  - name: interserver
    port: 9009
    targetPort: 9009
    protocol: TCP
  selector:
    {{- include "langfuse.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
{{- end }}
